<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Khay Ma trận Quyền riêng tư và kiểm soát Cookie của Veko Browser">
  <rect width="360" height="760" rx="34" fill="#070E1A" stroke="#253A5E" stroke-width="2" />

  <!-- Nền mờ bên dưới ModalBottomSheet -->
  <rect x="18" y="36" width="324" height="60" rx="16" fill="#0C1627" opacity="0.45" />

  <!-- ModalBottomSheet: Ma trận Quyền riêng tư Veko -->
  <g transform="translate(0, 108)">
    <rect width="360" height="652" rx="28" fill="#091220" stroke="#253A5E" />
    <rect x="160" y="12" width="40" height="4" rx="2" fill="#253A5E" />

    <text x="22" y="48" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Ma trận Quyền riêng tư Veko</text>
    <text x="22" y="68" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="11.5">Bộ lọc Rust adblock-rust 0.13.4 qua cầu nối C++20 JNI</text>

    <!-- Lưới 3 ô số liệu đối xứng -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="101" height="82" rx="16" fill="#101D33" stroke="#253A5E" />
      <text x="50.5" y="38" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">14</text>
      <text x="50.5" y="61" text-anchor="middle" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Quảng cáo chặn</text>

      <rect x="110" y="0" width="101" height="82" rx="16" fill="#101D33" stroke="#253A5E" />
      <text x="160.5" y="38" text-anchor="middle" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">9</text>
      <text x="160.5" y="61" text-anchor="middle" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tracker chặn</text>

      <rect x="220" y="0" width="100" height="82" rx="16" fill="#101D33" stroke="#253A5E" />
      <text x="270" y="38" text-anchor="middle" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="22" font-weight="800">5</text>
      <text x="270" y="61" text-anchor="middle" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">URL làm sạch</text>
    </g>

    <!-- Các công tắc bảo vệ thực -->
    <g transform="translate(20, 190)">
      <rect width="320" height="54" rx="14" fill="#101D33" />
      <text x="16" y="32" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Chặn tên miền quảng cáo &amp; tracker</text>
      <rect x="264" y="15" width="42" height="24" rx="12" fill="#38BDF8" />
      <circle cx="294" cy="27" r="9" fill="#070E1A" />
    </g>
    <g transform="translate(20, 254)">
      <rect width="320" height="54" rx="14" fill="#101D33" />
      <text x="16" y="32" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gọt tham số theo dõi (utm_*, fbclid)</text>
      <rect x="264" y="15" width="42" height="24" rx="12" fill="#38BDF8" />
      <circle cx="294" cy="27" r="9" fill="#070E1A" />
    </g>

    <!-- Kiểm soát Cookie 3 mức -->
    <g transform="translate(20, 330)">
      <text x="2" y="16" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Chính sách Cookie</text>

      <rect x="0" y="28" width="320" height="54" rx="14" fill="#0E3958" stroke="#38BDF8" />
      <circle cx="22" cy="55" r="7" fill="none" stroke="#38BDF8" stroke-width="2" />
      <circle cx="22" cy="55" r="3.5" fill="#38BDF8" />
      <text x="38" y="51" fill="#D8F3FF" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Chặn Cookie bên thứ ba</text>
      <text x="38" y="68" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="10.5">Giữ phiên đăng nhập trang chính, cô lập theo dõi chéo</text>

      <rect x="0" y="90" width="320" height="48" rx="14" fill="#101D33" stroke="#253A5E" />
      <circle cx="22" cy="114" r="7" fill="none" stroke="#9FB0CA" stroke-width="1.6" />
      <text x="38" y="119" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Chặn toàn bộ Cookie</text>

      <rect x="0" y="146" width="320" height="48" rx="14" fill="#101D33" stroke="#253A5E" />
      <circle cx="22" cy="170" r="7" fill="none" stroke="#9FB0CA" stroke-width="1.6" />
      <text x="38" y="175" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Cho phép Cookie tiêu chuẩn (Tab thường)</text>
    </g>
  </g>
</svg>
