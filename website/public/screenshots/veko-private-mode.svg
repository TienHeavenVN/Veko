  <!-- PrivateModeNoticeCard trung thực -->
  <g transform="translate(18, 328)">
    <rect width="324" height="206" rx="20" fill="#0C1627" stroke="#2DD4BF" stroke-opacity="0.45" />
    <path d="M36 22 L43 25 V31 C43 35.5 40 38.8 36 40 C32 38.8 29 35.5 29 31 V25 Z" fill="none" stroke="#2DD4BF" stroke-width="1.8" />
