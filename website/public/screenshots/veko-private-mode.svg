    <text x="236" y="174" text-anchor="middle" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Đóng hết (1)</text>
  </g>

  <!-- BrowserBottomBar -->
  <g transform="translate(0, 686)">
    <rect width="360" height="74" fill="#091220" />
    <line x1="0" y1="0" x2="360" y2="0" stroke="#1E4E4E" stroke-width="1" />
    <rect x="52" y="13" width="176" height="44" rx="22" fill="#143258" />
    <text x="86" y="39" fill="#DBEAFE" font-family="system-ui, sans-serif" font-size="12.5">Tìm hoặc nhập URL</text>
    <rect x="278" y="21" width="28" height="28" rx="8" fill="none" stroke="#2DD4BF" stroke-width="1.8" />
    <text x="292" y="39" text-anchor="middle" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1</text>
