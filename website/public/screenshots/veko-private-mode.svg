    <text x="235" y="26" text-anchor="middle" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tab thường</text>

    <circle cx="308" cy="22" r="18" fill="#101D33" />
    <circle cx="308" cy="22" r="5" fill="none" stroke="#9FB0CA" stroke-width="1.8" />
  </g>

