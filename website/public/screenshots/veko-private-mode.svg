<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-label="Giao diện Chế độ Riêng tư Veko Browser cô lập trên RAM">
  <defs>
    <linearGradient id="privGlow" x1="15%" y1="0%" x2="85%" y2="45%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#070E1A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="privEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="360" height="760" rx="34" fill="#070E1A" stroke="#1E4E4E" stroke-width="2" />
  <rect x="2" y="2" width="356" height="320" rx="32" fill="url(#privGlow)" />

  <text x="24" y="28" fill="#9FB0CA" font-family="system-ui, sans-serif" font-size="11" font-weight="600">09:42</text>

  <!-- HomeHeader ở chế độ Riêng tư -->
  <g transform="translate(18, 52)">
    <rect x="0" y="3" width="38" height="38" rx="12" fill="url(#privEmblem)" />
    <path d="M11 14 L19 30 L27 14" fill="none" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="19" cy="15" r="2.1" fill="#CCFBF1" />
    <text x="48" y="29" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="23" font-weight="800">Veko</text>

