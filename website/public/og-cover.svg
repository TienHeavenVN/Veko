<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Veko Browser — Trình duyệt Android tối giản, ưu tiên quyền riêng tư">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="55%" stop-color="#0A1426" />
      <stop offset="100%" stop-color="#0E1E38" />
    </linearGradient>
    <radialGradient id="glowCyan" cx="78%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050A14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E3354" stroke-width="1" stroke-opacity="0.38" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />

  <!-- Khung thông tin bên trái -->
  <g transform="translate(84, 96)">
    <rect x="0" y="0" width="68" height="68" rx="20" fill="url(#logoGrad)" />
    <path d="M20 24 L34 50 L48 24" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="34" cy="25" r="3.8" fill="#A5F3FC" />

    <rect x="86" y="16" width="292" height="36" rx="18" fill="#0E1C33" stroke="#243B61" />
    <text x="106" y="39" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="15" font-weight="700">ANDROID BROWSER • 0 TELEMETRY</text>

    <text x="0" y="148" fill="#F1F6FD" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5">Veko Browser</text>
    <text x="0" y="214" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">Trình duyệt gọn trong tầm tay.</text>
    <text x="0" y="264" fill="#9FB2CD" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">Thanh địa chỉ dưới đáy • Tab riêng tư trên RAM • Lá chắn Rust FFI</text>

    <g transform="translate(0, 326)">
      <rect x="0" y="0" width="210" height="54" rx="14" fill="#0D192E" stroke="#263E66" />
      <text x="22" y="24" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">ENGINE HIỂN THỊ</text>
      <text x="22" y="43" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Mozilla GeckoView</text>

      <rect x="226" y="0" width="218" height="54" rx="14" fill="#0D192E" stroke="#263E66" />
      <text x="248" y="24" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="13" font-weight="700">BỘ LỌC ĐIỀU HƯỚNG</text>
      <text x="248" y="43" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="16" font-weight="700">adblock-rust + JNI</text>

      <rect x="460" y="0" width="198" height="54" rx="14" fill="#0D192E" stroke="#263E66" />
      <text x="482" y="24" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="13" font-weight="700">TRẦN PHIÊN SỐNG</text>
      <text x="482" y="43" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="16" font-weight="700">6 Tabs LRU RAM</text>
    </g>

    <text x="0" y="426" fill="#6E84A6" font-family="ui-monospace, monospace" font-size="16">tiendayy.kdns.fr • github.com/TienHeavenVN/Zeko</text>
  </g>

  <!-- Mô phỏng khung thiết bị Android bên phải -->
  <g transform="translate(838, 66)">
    <rect x="0" y="0" width="278" height="500" rx="34" fill="#070E1A" stroke="#2B4672" stroke-width="2.5" />
    <rect x="20" y="34" width="32" height="32" rx="10" fill="url(#logoGrad)" />
    <path d="M29 44 L36 58 L43 44" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="56" fill="#F1F6FD" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Veko</text>
    <rect x="178" y="36" width="80" height="28" rx="14" fill="#13233D" stroke="#29436C" />
    <text x="195" y="54" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Riêng tư</text>

    <rect x="20" y="88" width="238" height="76" rx="18" fill="#0E1B31" stroke="#38BDF8" stroke-opacity="0.55" />
    <text x="36" y="116" fill="#9FB2CD" font-family="system-ui, sans-serif" font-size="12">Tìm kiếm hoặc nhập địa chỉ...</text>
    <rect x="34" y="130" width="94" height="22" rx="11" fill="#081120" stroke="#243B61" />
    <text x="46" y="145" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="10" font-weight="600">DuckDuckGo</text>

    <g transform="translate(20, 182)">
      <rect x="0" y="0" width="54" height="52" rx="14" fill="#0E1B31" stroke="#22385B" />
      <rect x="61" y="0" width="54" height="52" rx="14" fill="#0E1B31" stroke="#22385B" />
      <rect x="122" y="0" width="54" height="52" rx="14" fill="#0E1B31" stroke="#22385B" />
      <rect x="184" y="0" width="54" height="52" rx="14" fill="#0E1B31" stroke="#22385B" />
    </g>

    <rect x="20" y="254" width="238" height="62" rx="16" fill="#0B1629" stroke="#1E3354" />
    <text x="36" y="281" fill="#E6EEF9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">kotlinlang.org</text>
    <text x="36" y="299" fill="#8EA3C3" font-family="system-ui, sans-serif" font-size="10">Lối tắt cục bộ trên thiết bị</text>

    <rect x="14" y="434" width="250" height="50" rx="22" fill="#0E1B31" stroke="#29436C" />
    <rect x="54" y="444" width="118" height="30" rx="15" fill="#081120" stroke="#243B61" />
    <text x="74" y="463" fill="#9FB2CD" font-family="system-ui, sans-serif" font-size="10">Tìm hoặc nhập URL</text>
  </g>
</svg>
