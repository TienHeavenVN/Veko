  STAGING TEMPLATE NOTICE:
  * In-repo path: metadata/fdroid/io.veko.browser.yml (Veko repository staging).
  * Official upstream target path: metadata/io.veko.browser.yml in https://gitlab.com/fdroid/fdroiddata.
  * Current readiness: METADATA PREPARED & FDROID LINT PASSED, while F-Droid VM BUILD remains BLOCKED solely on MozFennec source-build integration.

  Status of the 4 F-Droid readiness items:
  1. Blocker 1 (BLOCKED - GeckoView prebuilt AAR): Default Gradle builds resolve org.mozilla.geckoview:geckoview:150.0.20260511200624 from https://maven.mozilla.org/maven2/ (corresponding to MozFennec tag FIREFOX-ANDROID_150_0_3_RELEASE, commit a077abc2b0f43ed7cc59a8bfcd873e683500d23a). settings.gradle.kts and app/build.gradle.kts support -Pveko.geckoview.useMavenLocal=true, -Pveko.geckoview.artifact=..., and -Pveko.geckoview.version=... so an F-Droid recipe with srclibs MozFennec@FIREFOX-ANDROID_150_0_3_RELEASE can publish GeckoView to mavenLocal() and remove the maven.mozilla.org block in prebuild.
  2. Blocker 2 (REMEDIATED - Unsigned Release APK): app/build.gradle.kts supports -PfdroidUnsignedRelease=true (via gradleprops) to emit app-<abi>-release-unsigned.apk without developer signing keys and with dependenciesInfo disabled, while keeping default developer-signed assembleRelease fail-fast.
  3. Blocker 3 (REMEDIATED - Offline Rust): privacy/rust/veko-adblock/Cargo.lock is committed with verified crates.io SHA-256 checksums, and scripts/vendor-rust-deps.sh vendors crates in prebuild for CARGO_NET_OFFLINE=true (--locked --offline) compilation.
  4. Blocker 4 (REMEDIATED for v0.3.0 / versionCode=3 active on source): Root MPL-2.0 LICENSE is present, official tag v0.3.0 (versionCode=2) is published on main, and active source branch bumps to versionCode=3 (0.4.0-privacy-shield).

