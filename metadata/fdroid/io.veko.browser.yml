Builds:
  - versionName: 0.4.0-privacy-shield
    versionCode: 3
    disable: 'STAGING / BUILD BLOCKED: Default Gradle resolution still fetches
      prebuilt org.mozilla.geckoview:geckoview:150.0.20260511200624 AAR (.so
      binaries) from maven.mozilla.org until srclibs
      MozFennec@FIREFOX-ANDROID_150_0_3_RELEASE offline source compilation is
      integrated and verified.'
    commit: ccf7a8bf7a6bcae2d034443ccd666d6b45ef1a38
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends clang
        openjdk-17-jdk-headless pkg-config python3 rustup
    gradle:
      - yes
    rm:
      - gradle/wrapper/gradle-wrapper.jar
    prebuild:
      - rustup default 1.86.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi
        x86_64-linux-android
      - bash ../scripts/vendor-rust-deps.sh --prepare
    scanignore:
      - privacy/rust/veko-adblock/vendor/regex-automata-0.4.14/tests/fuzz/testdata
    scandelete:
      - privacy/rust/veko-adblock/vendor
    build:
      - VEKO_OFFLINE_BUILD=true bash ../scripts/build-adblock-native.sh
        --mode=android --abi=arm64-v8a
      - VEKO_OFFLINE_BUILD=true bash ../scripts/build-adblock-native.sh
        --mode=android --abi=armeabi-v7a
      - VEKO_OFFLINE_BUILD=true bash ../scripts/build-adblock-native.sh
        --mode=android --abi=x86_64
    ndk: 27.2.12479018
    gradleprops:
      - fdroidUnsignedRelease=true

MaintainerNotes: |-
  STAGING TEMPLATE NOTICE:
  * In-repo path: metadata/fdroid/io.veko.browser.yml (Veko repository staging).
  * Official upstream target path: metadata/io.veko.browser.yml in https://gitlab.com/fdroid/fdroiddata.
  * Current readiness: METADATA PREPARED & FDROID LINT PASSED, while F-Droid VM BUILD remains BLOCKED on MozFennec source-build integration.

  Honest 5-Point GeckoView Audit for F-Droid:
  1. Source vs Prebuilt AAR: Default Gradle builds resolve org.mozilla.geckoview:geckoview:150.0.20260511200624 as a prebuilt AAR from https://maven.mozilla.org/maven2/ (corresponding to MozFennec tag FIREFOX-ANDROID_150_0_3_RELEASE, commit a077abc2b0f43ed7cc59a8bfcd873e683500d23a).
  2. Prebuilt .so Binaries: YES — the Mozilla Maven AAR bundles 7 precompiled ELF shared libraries per ABI (libxul.so, libmozglue.so, libnss3.so, liblgpllibs.so, libfreebl3.so, libsoftokn3.so, libipcclientcerts.so).
  3. Direct fdroiddata Acceptance: NO — fdroiddata rejects unknown Maven repositories (maven.mozilla.org) and prebuilt native .so binaries even under MPL-2.0.
  4. Blocker Status: BLOCKED until GeckoView is compiled offline from source via srclibs MozFennec@FIREFOX-ANDROID_150_0_3_RELEASE into mavenLocal() (-Pveko.geckoview.useMavenLocal=true).
  5. Architectural Scope: Veko is now 100% GeckoView-only with pure Cargo + Android NDK Clang++ native compilation (scripts/build-adblock-native.sh -> libveko_adblock_jni.so), which simplifies the app build but does NOT by itself unblock F-Droid submission.

