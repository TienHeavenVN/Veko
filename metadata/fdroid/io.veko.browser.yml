AutoName: Veko

Summary: Privacy-focused Android browser with one-handed bottom bar
Description: |-
  Veko Browser is an open-source web browser for Android 8.0+ designed around
  one-handed bottom navigation, strict memory discipline, and local-only user
  data storage without analytics or advertising SDKs.

  Verified capabilities in the current source tree:
  * Mozilla GeckoView rendering engine (Gecko + SpiderMonkey) with Enhanced
    Tracking Protection and Dynamic First-Party Isolation (dFPI).
  * Bottom-anchored address bar and one-handed horizontal/vertical tab gestures.
  * Hard 6-live-session LRU cap (MAX_LIVE_SESSIONS = 6) that freezes older
    background tabs and lazily restores them on demand.
  * Isolated Private Browsing tabs kept in volatile RAM (excluded from Room
    SQLite history and DataStore tab-restore files) with FLAG_SECURE protection.
  * Native Rust content shield (brave/adblock-rust 0.13.4) bridged via C++20 JNI
    for tracker domain filtering and URL tracking-parameter stripping.
  * Origin-scoped Camera, Microphone, and Location permissions (scheme://host:port)
    and scoped MediaStore downloads with filename/MIME checks.

  Note: Dual-engine support for a secondary Chromium Content embedder is
  currently under development and disabled by default in standard builds.

