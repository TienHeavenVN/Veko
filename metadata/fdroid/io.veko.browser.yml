      root LICENSE commit 7d601482fb020a0a9abfe600828e6da2643b7075 and lacks a
      committed Cargo.lock for offline Rust builds.
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends clang generate-ninja ninja-build python3
    gradle:
      - yes
    rm:
      - gradle/wrapper/gradle-wrapper.jar
    build:
      - bash ../scripts/build-native-gn.sh --mode=android --abi=$$ABI$$
    ndk: 27.2.12479018

