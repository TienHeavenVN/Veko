name: Build Veko APKs

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug & Release APKs (ABI Splits)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore (optional via GitHub Secrets)
        env:
          VEKO_KEYSTORE_BASE64: ${{ secrets.VEKO_KEYSTORE_BASE64 }}
          VEKO_KEYSTORE_PASSWORD: ${{ secrets.VEKO_KEYSTORE_PASSWORD }}
          VEKO_KEY_ALIAS: ${{ secrets.VEKO_KEY_ALIAS }}
          VEKO_KEY_PASSWORD: ${{ secrets.VEKO_KEY_PASSWORD }}
        run: |
          if [ -n "$VEKO_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/veko-release.jks"
            echo "$VEKO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "VEKO_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "VEKO_KEYSTORE_PASSWORD=$VEKO_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VEKO_KEY_ALIAS=$VEKO_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VEKO_KEY_PASSWORD=$VEKO_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using custom Release Keystore from GitHub Secrets."
          else
            echo "No VEKO_KEYSTORE_BASE64 secret configured; falling back to installable debug-signed Release APKs."
          fi

      - name: Build ABI-split Debug & Release APKs
        # --max-workers=2 giữ mức RAM an toàn trên runner khi đóng gói thư viện native libxul.so của GeckoView
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --max-workers=2 2>&1 | tee gradle-build.log; then
            ERR_SUMMARY=$(awk '/FAILURE:/,0' gradle-build.log | head -n 45 | tr '\n' ' ')
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 45 gradle-build.log | tr '\n' ' ')
            fi
            KOTLIN_ERRS=$(grep -E "^e: " gradle-build.log | head -n 20 | tr '\n' ' ' || true)
            echo "::error title=Gradle Build Error::${KOTLIN_ERRS} ${ERR_SUMMARY}"
            exit 1
          fi

      - name: Generate SHA-256 Checksums & Build Summary
        run: |
          echo "## 📦 Veko Browser — Kết quả Build APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Loại bản dựng | Tệp APK | Dung lượng | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :---: | :--- |" >> "$GITHUB_STEP_SUMMARY"

          mkdir -p build-artifacts/checksums
          : > build-artifacts/checksums/SHA256SUMS.txt

          for apk in $(find app/build/outputs/apk -type f -name "*.apk" | sort); do
            variant=$(echo "$apk" | awk -F'/' '{print $5}')
            filename=$(basename "$apk")
            size_human=$(du -h "$apk" | cut -f1)
            sha=$(sha256sum "$apk" | awk '{print $1}')
            echo "$sha  $filename" >> build-artifacts/checksums/SHA256SUMS.txt
            echo "| \`$variant\` | \`$filename\` | $size_human | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Release APK (arm64-v8a — hầu hết điện thoại hiện đại)
        uses: actions/upload-artifact@v7
        with:
          name: veko-release-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload Release APK (armeabi-v7a — thiết bị ARM 32-bit cũ)
        uses: actions/upload-artifact@v7
        with:
          name: veko-release-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload Release APK (x86_64 — máy ảo PC / Chromebook)
        uses: actions/upload-artifact@v7
        with:
          name: veko-release-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error

      - name: Upload All Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: veko-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload SHA-256 Checksums
        uses: actions/upload-artifact@v7
        with:
          name: veko-sha256-checksums
          path: build-artifacts/checksums/SHA256SUMS.txt

      - name: Publish GitHub Release on Tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            build-artifacts/checksums/SHA256SUMS.txt
