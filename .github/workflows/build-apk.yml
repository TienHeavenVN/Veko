name: Build Veko APKs

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag phát hành chính thức vX.Y.Z trên nhánh main (ví dụ v0.2.1 — để trống nếu chỉ chạy CI thử nghiệm)"
        required: false
        default: ""
        type: string

# Quyền mặc định tối thiểu cho toàn bộ workflow; chỉ cấp quyền ghi riêng cho job phát hành chính thức
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && !startsWith(inputs.release_tag, 'v') }}

jobs:
  ci-verify:
    name: CI — Unit Tests, Lint & Debug/Preview APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle with isolated cache policy
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Chỉ cho phép nhánh main ghi cache; PR và nhánh phụ chỉ đọc để chống nhiễm bẩn cache cho quy trình phát hành
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Ensure gradlew is executable
        run: |
          chmod +x ./gradlew \
            ./scripts/setup-native-toolchains.sh \
            ./scripts/build-native-gn.sh \
            ./scripts/vendor-rust-deps.sh \
            ./scripts/bootstrap-depot-tools.sh \
            ./scripts/build-chromium-android.sh \
            ./scripts/import-chromium-sdk.sh \
            ./scripts/verify-elf-packaging.py

      - name: Verify Chromium 156.0.8078.85 Lockfile, Build Scripts & Upstream Tag Provenance
        run: |
          set -euo pipefail
          bash -n ./scripts/bootstrap-depot-tools.sh ./scripts/build-chromium-android.sh ./scripts/import-chromium-sdk.sh ./scripts/build-native-gn.sh ./scripts/vendor-rust-deps.sh
          python3 -m py_compile ./scripts/verify-elf-packaging.py
          bash ./scripts/build-chromium-android.sh --preflight-only --abi=arm64-v8a | tee chromium-preflight.log
          grep -q "0c5c70590a804c285f0cafe8e9c4c20afcfbc5b5" chromium-preflight.log

      - name: Verify F-Droid Metadata Schema & Format via fdroidserver
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install --quiet fdroidserver
          FDROID_WORK="$RUNNER_TEMP/fdroiddata-check"
          mkdir -p "$FDROID_WORK/metadata" "$FDROID_WORK/config"
          cp metadata/fdroid/io.veko.browser.yml "$FDROID_WORK/metadata/io.veko.browser.yml"
          cat > "$FDROID_WORK/config/categories.yml" <<'EOF'
          Browser:
            name: Browser
          Internet:
            name: Internet
          Security:
            name: Security
          EOF
          cat > "$FDROID_WORK/config/antiFeatures.yml" <<'EOF'
          NonFreeNet:
            name: NonFreeNet
          EOF
          (
            cd "$FDROID_WORK"
            "$RUNNER_TEMP/fdroid-venv/bin/fdroid" readmeta
            "$RUNNER_TEMP/fdroid-venv/bin/fdroid" lint --format --force-yamllint io.veko.browser
          )
          "$RUNNER_TEMP/fdroid-venv/bin/python3" - <<'PY'
          import pathlib
          from PIL import Image
          for loc in ("en-US", "vi"):
              base = pathlib.Path(f"fastlane/metadata/android/{loc}")
              assert len((base / "title.txt").read_text(encoding="utf-8").strip()) <= 30
              assert len((base / "short_description.txt").read_text(encoding="utf-8").strip()) <= 80
              assert len((base / "full_description.txt").read_text(encoding="utf-8").strip()) <= 4000
              for cl in ("1.txt", "2.txt"):
                  assert len((base / "changelogs" / cl).read_bytes()) <= 500
              icon = Image.open(base / "images" / "icon.png")
              assert icon.format == "PNG" and icon.size == (512, 512)
              for n in ("1.png", "2.png", "3.png", "4.png"):
                  shot = Image.open(base / "images" / "phoneScreenshots" / n)
                  assert shot.format == "PNG" and shot.width >= 320 and shot.height > shot.width
                  assert not shot.getexif(), f"Unexpected EXIF in {loc}/{n}"
          for p in sorted(pathlib.Path("metadata/fdroid/screenshots").glob("*.png")):
              shot = Image.open(p)
              assert shot.format == "PNG" and shot.width >= 320 and shot.height > shot.width
              assert not shot.getexif(), f"Unexpected EXIF in {p}"
          PY
          FDROID_VER=$("$RUNNER_TEMP/fdroid-venv/bin/fdroid" --version)
          echo "::notice title=F-Droid Metadata & Fastlane Verified::fdroidserver ${FDROID_VER} readmeta + lint --format --force-yamllint + Fastlane (en-US, vi) + EXIF-free real PNG screenshots verified."

      - name: Set up GN, Ninja, Rust >= 1.86 & Android NDK toolchains
        run: bash ./scripts/setup-native-toolchains.sh --with-android

      - name: Vendor Rust Crates, Verify SHA-256 Integrity & Run Offline Native Tests
        run: |
          set -euo pipefail
          NATIVE_START=$(date +%s)
          if ! {
            bash ./scripts/vendor-rust-deps.sh --prepare
            VEKO_OFFLINE_BUILD=true bash ./scripts/vendor-rust-deps.sh --verify-offline
            VEKO_OFFLINE_BUILD=true bash ./scripts/build-native-gn.sh --mode=host
            ./out/host_x64/veko_chromium_native_tests
          } 2>&1 | tee native-verify.log; then
            ERR_TAIL=$(tail -n 35 native-verify.log | tr '\n' ' ')
            echo "::error title=Offline Native Rust/GN/C++20 Failure::${ERR_TAIL}"
            exit 1
          fi
          NATIVE_ELAPSED=$(( $(date +%s) - NATIVE_START ))
          HOST_SO_SIZE=$(du -h out/host_x64/libveko_chromium_native.so | cut -f1)
          echo "::notice title=Offline Rust Vendor & Native C++20 Verified::Cargo.lock + offline vendored adblock-rust 0.13.4 + C++20 veko_chromium_native_tests passed in ${NATIVE_ELAPSED}s (host libveko_chromium_native.so: ${HOST_SO_SIZE})."

      - name: Run Unit Tests & Android Lint
        run: |
          set -euo pipefail
          if ! ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2 2>&1 | tee gradle-verify.log; then
            ERR_SUMMARY=$(awk '/FAILURE:/,0' gradle-verify.log | head -n 45 | tr '\n' ' ')
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 45 gradle-verify.log | tr '\n' ' ')
            fi
            KOTLIN_ERRS=$(grep -E "^e: " gradle-verify.log | head -n 20 | tr '\n' ' ' || true)
            FAILED_TESTS=$(python3 - << 'PY' || true
          import glob, xml.etree.ElementTree as ET
          msgs = []
          for p in sorted(glob.glob("**/build/test-results/testDebugUnitTest/TEST-*.xml", recursive=True)):
              r = ET.parse(p).getroot()
              for tc in r.findall("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      msgs.append(f"{tc.attrib.get('name')}: {(fail.attrib.get('message') or fail.text or '')[:180]}")
          print(" | ".join(msgs))
          PY
          )
            echo "::error title=Unit Test or Lint Failure::${KOTLIN_ERRS} ${FAILED_TESTS} ${ERR_SUMMARY}"
            exit 1
          fi

          TEST_SUITES_SUMMARY=$(python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          total_tests = total_fail = total_err = 0
          suites = []
          for path in sorted(glob.glob("**/build/test-results/testDebugUnitTest/TEST-*.xml", recursive=True)):
              root = ET.parse(path).getroot()
              t = int(root.attrib.get("tests", 0))
              f = int(root.attrib.get("failures", 0))
              e = int(root.attrib.get("errors", 0))
              total_tests += t; total_fail += f; total_err += e
              suites.append(f"{root.attrib.get('name')}: {t} passed")
          assert total_tests > 0 and total_fail == 0 and total_err == 0
          print(f"Total {total_tests} tests passed (0 failures, 0 errors) | " + "; ".join(suites))
          PY
          )
          echo "::notice title=JUnit & Lint Verified::${TEST_SUITES_SUMMARY} | lintDebug passed with 0 errors."

      - name: Verify Official Release Signing Fail-Fast Guard
        run: |
          set -euo pipefail
          # Đảm bảo bản Release chính thức mặc định từ chối build khi không có khóa ký phát hành
          if ./gradlew :app:verifyReleaseSigningConfig --no-daemon > signing-guard.log 2>&1; then
            echo "::error title=Signing Policy Violation::verifyReleaseSigningConfig succeeded without release keystore!"
            exit 1
          fi
          grep -q "Official Release signing is not configured" signing-guard.log
          if ./gradlew :app:assembleRelease --no-daemon > assemble-release-guard.log 2>&1; then
            echo "::error title=Signing Policy Violation::Default assembleRelease succeeded without release keystore!"
            exit 1
          fi
          grep -q "Official Release signing is not configured" assemble-release-guard.log

      - name: Build ABI-split Debug, Preview (Trial R8) & Unsigned F-Droid Release APKs
        run: |
          set -euo pipefail
          APK_BUILD_START=$(date +%s)
          if ! ./gradlew :app:assembleDebug :app:assemblePreview --no-daemon --max-workers=2 2>&1 | tee gradle-build.log; then
            ERR_SUMMARY=$(awk '/FAILURE:/,0' gradle-build.log | head -n 45 | tr '\n' ' ')
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 45 gradle-build.log | tr '\n' ' ')
            fi
            KOTLIN_ERRS=$(grep -E "^e: " gradle-build.log | head -n 20 | tr '\n' ' ' || true)
            echo "::error title=Gradle Build Error::${KOTLIN_ERRS} ${ERR_SUMMARY}"
            exit 1
          fi
          if ! ./gradlew :app:assembleRelease -PfdroidUnsignedRelease=true --no-daemon --max-workers=2 2>&1 | tee gradle-fdroid-unsigned.log; then
            ERR_SUMMARY=$(awk '/FAILURE:/,0' gradle-fdroid-unsigned.log | head -n 45 | tr '\n' ' ')
            echo "::error title=Unsigned Release Build Error::${ERR_SUMMARY}"
            exit 1
          fi
          APK_BUILD_SECS=$(( $(date +%s) - APK_BUILD_START ))
          SO_ARM64=$(du -h chromium-native/build/generated/gnJniLibs/arm64-v8a/libveko_chromium_native.so | cut -f1)
          SO_ARM32=$(du -h chromium-native/build/generated/gnJniLibs/armeabi-v7a/libveko_chromium_native.so | cut -f1)
          SO_X64=$(du -h chromium-native/build/generated/gnJniLibs/x86_64/libveko_chromium_native.so | cut -f1)
          echo "::notice title=GN/Ninja Android Native & APK Metrics::Built Debug + Preview + Unsigned Release APKs in ${APK_BUILD_SECS}s | libveko_chromium_native.so sizes: arm64-v8a=${SO_ARM64}, armeabi-v7a=${SO_ARM32}, x86_64=${SO_X64}"

      - name: Verify Mandatory APKs, Signatures & Generate SHA-256 Checksums
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error title=Missing apksigner::Could not find executable apksigner in ANDROID_HOME/build-tools."
            exit 1
          fi

          mkdir -p build-artifacts/ci
          : > build-artifacts/ci/SHA256SUMS.txt
          : > build-artifacts/ci/APK_METRICS.txt

          echo "## 📦 Veko Browser — Kết quả Kiểm thử CI & APK Thử nghiệm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Lưu ý bảo mật:** Các bản dựng trong job CI này sử dụng khóa debug (\`Debug\` và \`Preview\` thử nghiệm \`.preview\`), **không phải** bản phát hành chính thức." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Phân loại | Tệp APK | Dung lượng | SHA-256 | Chữ ký xác minh (SHA-256 Cert) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :---: | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          for variant in debug preview; do
            for abi in arm64-v8a armeabi-v7a x86_64; do
              apk="app/build/outputs/apk/${variant}/app-${abi}-${variant}.apk"
              if [ ! -s "$apk" ]; then
                echo "::error title=Missing Mandatory APK::Required APK '$apk' is missing or empty."
                exit 1
              fi

              CERT_INFO=$("$APKSIGNER" verify --print-certs "$apk")
              CERT_SHA256=$(echo "$CERT_INFO" | grep -oiE 'certificate SHA-256 digest:[[:space:]]*[0-9a-fA-F:]+' | head -n 1 | sed -E 's/.*:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
              if [ -z "$CERT_SHA256" ]; then
                echo "::error title=Signature Verification Failed::Failed to extract signer SHA-256 digest for '$apk'. Output: $(echo "$CERT_INFO" | tr '\n' ' ')"
                exit 1
              fi

              # Kiểm định ELF 16 KB page-size alignment, JNI_OnLoad, DT_NEEDED allowlist và tính đơn nhất ABI trong từng APK
              python3 ./scripts/verify-elf-packaging.py \
                --check-apk "$apk" \
                --expected-abi "$abi" \
                --require-page-size 16384 \
                --output-json "build-artifacts/ci/elf-${variant}-${abi}.json"

              filename=$(basename "$apk")
              cp "$apk" "build-artifacts/ci/$filename"
              size_human=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "build-artifacts/ci/$filename" | awk '{print $1}')
              echo "$sha  $filename  ($size_human)" >> build-artifacts/ci/APK_METRICS.txt
              echo "$sha  $filename" >> build-artifacts/ci/SHA256SUMS.txt
              echo "| \`$variant\` | \`$filename\` | $size_human | \`$sha\` | \`$CERT_SHA256\` (debug/trial key) |" >> "$GITHUB_STEP_SUMMARY"
            done
          done

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            uapk="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            if [ ! -s "$uapk" ]; then
              echo "::error title=Missing Unsigned Release APK::Expected unsigned APK '$uapk' was not generated."
              exit 1
            fi
            if "$APKSIGNER" verify "$uapk" > /dev/null 2>&1; then
              echo "::error title=Unexpected Signature on Unsigned APK::'$uapk' must be unsigned in -PfdroidUnsignedRelease=true mode!"
              exit 1
            fi
            if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
              BADGING=$("$AAPT2" dump badging "$uapk" | head -n 5)
              echo "$BADGING" | grep -q "name='io.veko.browser'"
              echo "$BADGING" | grep -q "versionCode='3'"
              echo "$BADGING" | grep -q "versionName='0.4.0-privacy-shield'"
            fi
            python3 - "$uapk" <<'PY'
          import pathlib, sys, zipfile
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          assert b"APK Sig Block 42" not in raw, "Unsigned APK must not contain any APK Sig Block or 0x504B4453 DependenciesInfo block"
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              sig_files = [n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC", ".SF"))]
              assert not sig_files, f"Found unexpected signature files in unsigned APK: {sig_files}"
          PY
            python3 ./scripts/verify-elf-packaging.py \
              --check-apk "$uapk" \
              --expected-abi "$abi" \
              --require-page-size 16384 \
              --output-json "build-artifacts/ci/elf-release-unsigned-${abi}.json"
            ufile=$(basename "$uapk")
            usize=$(du -h "$uapk" | cut -f1)
            usha=$(sha256sum "$uapk" | awk '{print $1}')
            echo "| \`release-unsigned\` | \`$ufile\` | $usize | \`$usha\` | \`UNSIGNED\` (F-Droid buildserver ready) |" >> "$GITHUB_STEP_SUMMARY"
          done
          bash ./scripts/vendor-rust-deps.sh --clean

          (
            cd build-artifacts/ci
            sha256sum --check --strict SHA256SUMS.txt
          )
          SUMS_INLINE=$(tr '\n' '; ' < build-artifacts/ci/APK_METRICS.txt)
          NATIVE_SO_SIZES=$(du -h chromium-native/build/generated/gnJniLibs/*/libveko_chromium_native.so 2>/dev/null | awk '{print $2 "=" $1}' | tr '\n' ' ' || true)
          echo "::notice title=APK & Signature Verification::Verified 6 signed CI APKs + 3 unsigned F-Droid release APKs (versionCode=3) & sha256sum --check: ${SUMS_INLINE} | Native .so: ${NATIVE_SO_SIZES}"

      - name: Upload Preview Trial APK (arm64-v8a — bản thử nghiệm R8)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-preview-arm64-v8a
          path: build-artifacts/ci/app-arm64-v8a-preview.apk
          if-no-files-found: error

      - name: Upload Preview Trial APK (armeabi-v7a — bản thử nghiệm R8)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-preview-armeabi-v7a
          path: build-artifacts/ci/app-armeabi-v7a-preview.apk
          if-no-files-found: error

      - name: Upload Preview Trial APK (x86_64 — bản thử nghiệm R8)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-preview-x86_64
          path: build-artifacts/ci/app-x86_64-preview.apk
          if-no-files-found: error

      - name: Upload All Debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-debug-apks
          path: build-artifacts/ci/app-*-debug.apk
          if-no-files-found: error

      - name: Upload CI SHA-256 Checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-ci-sha256-checksums
          path: |
            build-artifacts/ci/SHA256SUMS.txt
            build-artifacts/ci/APK_METRICS.txt
            build-artifacts/ci/elf-*.json
          if-no-files-found: error

  emulator-test:
    name: CI — Android Emulator Instrumented Tests (API 34 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle with isolated cache policy
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Prepare scripts & Android cmdline-tools symlink
        run: |
          set -euo pipefail
          chmod +x ./gradlew \
            ./scripts/run-emulator-tests.sh \
            ./scripts/setup-native-toolchains.sh \
            ./scripts/build-native-gn.sh \
            ./scripts/verify-elf-packaging.py
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            LATEST_CMDLINE=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1 || true)
            if [ -n "$LATEST_CMDLINE" ]; then
              ln -sfn "$LATEST_CMDLINE" "$ANDROID_HOME/cmdline-tools/latest"
            fi
          fi
          bash ./scripts/setup-native-toolchains.sh --with-android

      - name: Pre-compile Debug & AndroidTest APKs before booting Emulator
        run: |
          set -euo pipefail
          if ! ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 2>&1 | tee gradle-androidtest-build.log; then
            ERR_SUMMARY=$(awk '/FAILURE:/,0' gradle-androidtest-build.log | head -n 45 | tr '\n' ' ')
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 45 gradle-androidtest-build.log | tr '\n' ' ')
            fi
            KOTLIN_ERRS=$(grep -E "^e: " gradle-androidtest-build.log | head -n 20 | tr '\n' ' ' || true)
            echo "::error title=AndroidTest Build Error::${KOTLIN_ERRS} ${ERR_SUMMARY}"
            exit 1
          fi

      - name: Enable KVM hardware acceleration on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          avd-name: veko-api34-x86_64
          force-avd-creation: true
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ./scripts/run-emulator-tests.sh

      - name: Pack Lossless 1080x2400 24-bit TrueColor Emulator Screenshots
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 -m venv /tmp/veko-img-venv
          /tmp/veko-img-venv/bin/pip install --quiet pillow
          /tmp/veko-img-venv/bin/python - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, struct
          from PIL import Image

          src_dir = pathlib.Path("app/build/outputs/emulator-diagnostics/screenshots")
          mapping = [
              ("veko_ci_home_shortcuts.png", "1-home.png"),
              ("veko_ci_tab_switcher.png", "2-tabs-lru.png"),
              ("veko_ci_home_private.png", "3-private-mode.png"),
              ("veko_ci_dual_engine_settings.png", "4-engine-settings.png"),
              ("veko_ci_privacy_shield.png", "5-privacy-shield.png"),
          ]
          entries = []
          payload = bytearray()
          for src_name, dst_name in mapping:
              p = src_dir / src_name
              assert p.is_file(), f"Missing captured emulator screenshot: {p}"
              im = Image.open(p).convert("RGB")
              w, h = im.size
              assert (w, h) == (1080, 2400), f"Expected native 1080x2400 screenshot for {dst_name}, got {w}x{h}"
              buf = io.BytesIO()
              im.save(buf, format="PNG", optimize=True, compress_level=9)
              png_bytes = buf.getvalue()
              bd, ct = struct.unpack(">BB", png_bytes[24:26])
              assert bd == 8 and ct == 2, f"Expected 8-bit TrueColor (color_type=2), got bd={bd}, ct={ct}"
              sha = hashlib.sha256(png_bytes).hexdigest()
              entries.append({"name": dst_name, "width": w, "height": h, "size": len(png_bytes), "sha256": sha})
              raw = im.tobytes()
              stride = w * 3
              prev = bytes(stride)
              for y in range(h):
                  row = raw[y * stride : (y + 1) * stride]
                  payload.extend(((a - b) & 0xFF) for a, b in zip(row, prev))
                  prev = row
          header = json.dumps({"entries": entries}).encode("utf-8")
          blob = struct.pack(">I", len(header)) + header + bytes(payload)
          xz = lzma.compress(blob, preset=9 | lzma.PRESET_EXTREME)
          b64 = base64.b64encode(xz).decode("ascii")
          out_dir = pathlib.Path("app/build/outputs/emulator-diagnostics")
          (out_dir / "veko_1080p_solid.b64").write_text(b64, encoding="ascii")
          (out_dir / "veko_1080p_manifest.json").write_text(
              json.dumps({"xz_bytes": len(xz), "b64_len": len(b64), "xz_sha256": hashlib.sha256(xz).hexdigest(), "entries": entries}, indent=2),
              encoding="utf-8",
          )
          print(f"Packed 5 lossless 1080x2400 RGB screenshots -> solid XZ={len(xz)} bytes, b64={len(b64)} chars")
          PY

      - name: Upload Android Emulator Test Reports & Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/emulator-diagnostics/
          if-no-files-found: ignore

  screenshot-pack:
    name: CI — Lossless 1080x2400 Screenshot Shard (${{ matrix.shard }})
    needs: emulator-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Download Emulator Diagnostics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veko-emulator-test-reports
          path: /tmp/emu-diag

      - name: Split Shard Slices
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          shard = int(os.environ["SHARD_ID"])
          b64_path = next(pathlib.Path("/tmp/emu-diag").rglob("veko_1080p_solid.b64"))
          manifest_path = next(pathlib.Path("/tmp/emu-diag").rglob("veko_1080p_manifest.json"))
          b64 = b64_path.read_text(encoding="ascii").strip()
          chunk_size = 3800
          chunks = [b64[i:i+chunk_size] for i in range(0, len(b64), chunk_size)]
          per_shard = 40
          start = shard * per_shard
          end = min(len(chunks), start + per_shard)
          out = pathlib.Path("/tmp/shard_batches")
          out.mkdir(parents=True, exist_ok=True)
          if shard == 0:
              (out / "meta.txt").write_text(" ".join(manifest_path.read_text(encoding="utf-8").split()), encoding="utf-8")
          for b in range(5):
              s = start + b * 8
              e = min(end, s + 8)
              lines = [f"{idx:03d}:{len(chunks):03d}:{chunks[idx]}" for idx in range(s, e)] if s < end else []
              (out / f"batch_{b}.txt").write_text("\n".join(lines), encoding="ascii")
          PY

      - name: Emit Shard Batch 0
        run: |
          if [ -f /tmp/shard_batches/meta.txt ]; then
            echo "::notice title=VEKO1080_META::$(cat /tmp/shard_batches/meta.txt)"
          fi
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=VEKO1080_CHUNK::${line}"; done < /tmp/shard_batches/batch_0.txt

      - name: Emit Shard Batch 1
        run: |
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=VEKO1080_CHUNK::${line}"; done < /tmp/shard_batches/batch_1.txt

      - name: Emit Shard Batch 2
        run: |
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=VEKO1080_CHUNK::${line}"; done < /tmp/shard_batches/batch_2.txt

      - name: Emit Shard Batch 3
        run: |
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=VEKO1080_CHUNK::${line}"; done < /tmp/shard_batches/batch_3.txt

      - name: Emit Shard Batch 4
        run: |
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=VEKO1080_CHUNK::${line}"; done < /tmp/shard_batches/batch_4.txt

  release-official:
    name: Official Release — Signed APKs & GitHub Release
    needs:
      - ci-verify
      - emulator-test
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to main branch lineage
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          RESOLVED_TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid Release Tag::Release tag '${RESOLVED_TAG}' must follow vX.Y.Z format (e.g. v0.2.0)."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error title=Blocked Non-Main Release::Tag '${RESOLVED_TAG}' points to a commit not merged into 'main'. Aborting release."
            exit 1
          fi
          echo "RELEASE_TAG=${RESOLVED_TAG}" >> "$GITHUB_ENV"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Gradle (read-only cache from main)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Ensure gradlew is executable & set up native toolchains
        run: |
          chmod +x ./gradlew ./scripts/setup-native-toolchains.sh ./scripts/build-native-gn.sh ./scripts/vendor-rust-deps.sh ./scripts/verify-elf-packaging.py
          bash ./scripts/setup-native-toolchains.sh --with-android
          bash ./scripts/vendor-rust-deps.sh --prepare
          VEKO_OFFLINE_BUILD=true bash ./scripts/vendor-rust-deps.sh --verify-offline

      - name: Validate & Decode Official Release Keystore
        env:
          VEKO_KEYSTORE_BASE64: ${{ secrets.VEKO_KEYSTORE_BASE64 }}
          VEKO_KEYSTORE_PASSWORD: ${{ secrets.VEKO_KEYSTORE_PASSWORD }}
          VEKO_KEY_ALIAS: ${{ secrets.VEKO_KEY_ALIAS }}
          VEKO_KEY_PASSWORD: ${{ secrets.VEKO_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail

          MISSING=()
          [ -z "${VEKO_KEYSTORE_BASE64:-}" ] && MISSING+=("VEKO_KEYSTORE_BASE64")
          [ -z "${VEKO_KEYSTORE_PASSWORD:-}" ] && MISSING+=("VEKO_KEYSTORE_PASSWORD")
          [ -z "${VEKO_KEY_ALIAS:-}" ] && MISSING+=("VEKO_KEY_ALIAS")
          [ -z "${VEKO_KEY_PASSWORD:-}" ] && MISSING+=("VEKO_KEY_PASSWORD")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error title=Missing Release Signing Secrets::Required secrets missing: ${MISSING[*]}. Official release aborted."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/veko-release.jks"
          umask 077
          if ! printf '%s' "$VEKO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error title=Invalid Keystore Base64::Failed to base64-decode VEKO_KEYSTORE_BASE64."
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error title=Empty Keystore::Decoded keystore file is empty."
            exit 1
          fi

          KEYTOOL_OUT=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$VEKO_KEY_ALIAS" -storepass:env VEKO_KEYSTORE_PASSWORD)
          if echo "$KEYTOOL_OUT" | grep -qi "CN=Android Debug"; then
            echo "::error title=Forbidden Debug Key::Release keystore contains an Android Debug certificate!"
            exit 1
          fi

          EXPECTED_FP=$(echo "$KEYTOOL_OUT" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED_FP" ]; then
            echo "::error title=Invalid Keystore Alias::Could not extract SHA-256 fingerprint for alias."
            exit 1
          fi

          echo "VEKO_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT_SHA256=$EXPECTED_FP" >> "$GITHUB_ENV"

      - name: Build Signed Official Release APKs
        env:
          VEKO_KEYSTORE_PASSWORD: ${{ secrets.VEKO_KEYSTORE_PASSWORD }}
          VEKO_KEY_ALIAS: ${{ secrets.VEKO_KEY_ALIAS }}
          VEKO_KEY_PASSWORD: ${{ secrets.VEKO_KEY_PASSWORD }}
          VEKO_OFFLINE_BUILD: "true"
        run: |
          set +x
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          bash ./scripts/vendor-rust-deps.sh --clean

      - name: Verify Official APK Signatures, Fingerprint & Checksums
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error title=Missing apksigner::Could not find executable apksigner in ANDROID_HOME/build-tools."
            exit 1
          fi

          mkdir -p build-artifacts/release
          : > build-artifacts/release/SHA256SUMS.txt

          echo "## 🚀 Veko Browser — Bản phát hành chính thức (${RELEASE_TAG})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tệp APK | Dung lượng | SHA-256 | Fingerprint chứng chỉ ký (SHA-256) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :---: | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error title=Missing Official Release APK::Required APK '$apk' is missing or empty."
              exit 1
            fi

            CERT_INFO=$("$APKSIGNER" verify --verbose --print-certs "$apk")
            if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
              echo "::error title=Debug Signature Detected::Official release APK '$apk' is signed with Android Debug key!"
              exit 1
            fi

            ACTUAL_FP=$(echo "$CERT_INFO" | grep -oiE 'certificate SHA-256 digest:[[:space:]]*[0-9a-fA-F:]+' | head -n 1 | sed -E 's/.*:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' || true)
            if [ -z "$ACTUAL_FP" ] || [ "$ACTUAL_FP" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error title=Certificate Mismatch::APK '$apk' signer digest ($ACTUAL_FP) does not match expected keystore alias digest ($EXPECTED_CERT_SHA256)."
              exit 1
            fi

            python3 ./scripts/verify-elf-packaging.py \
              --check-apk "$apk" \
              --expected-abi "$abi" \
              --require-page-size 16384

            filename=$(basename "$apk")
            cp "$apk" "build-artifacts/release/$filename"
            size_human=$(du -h "$apk" | cut -f1)
            sha=$(sha256sum "build-artifacts/release/$filename" | awk '{print $1}')
            echo "$sha  $filename" >> build-artifacts/release/SHA256SUMS.txt
            echo "| \`$filename\` | $size_human | \`$sha\` | \`$ACTUAL_FP\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          (
            cd build-artifacts/release
            sha256sum --check --strict SHA256SUMS.txt
          )
          echo "::notice title=Official Release Checksums::$(tr '\n' '; ' < build-artifacts/release/SHA256SUMS.txt)"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build-artifacts/release/app-arm64-v8a-release.apk
            build-artifacts/release/app-armeabi-v7a-release.apk
            build-artifacts/release/app-x86_64-release.apk
            build-artifacts/release/SHA256SUMS.txt

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/veko-release.jks"
