name: Build Veko Official Website

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Triển khai lên GitHub Pages (chỉ bật sau khi đã chọn Source: GitHub Actions trong Settings -> Pages)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-website:
    name: Website — TypeCheck, Lint, Build, Verify & Visual Capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Run Astro & TypeScript strict check
        run: npm run check

      - name: Run website source lint (privacy & link honesty rules)
        run: npm run lint

      - name: Verify subpath compatibility (/Zeko)
        env:
          SITE_URL: "https://tienheavenvn.github.io"
          BASE_PATH: "/Zeko"
        run: |
          npm run build
          npm run test:dist

      - name: Build & verify production static website for custom domain (tiendayy.kdns.fr)
        env:
          SITE_URL: "https://tiendayy.kdns.fr"
          BASE_PATH: "/"
        run: |
          npm run build
          npm run test:dist
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          echo "::notice title=Website Build Verified::Astro static build + custom domain tiendayy.kdns.fr link/ARIA/SEO/JSON-LD verification passed (dist size: ${TOTAL_SIZE})."

      - name: Capture Desktop, Tablet & Mobile visual screenshots via Headless Chrome
        run: |
          mkdir -p screenshots-ci
          npx astro preview --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          PREVIEW_PID=$!
          trap "kill ${PREVIEW_PID} 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          CHROME_BIN=$(command -v google-chrome || true)
          if [ -n "${CHROME_BIN}" ]; then
            "${CHROME_BIN}" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,1080 --screenshot=screenshots-ci/veko-website-desktop.png \
              http://127.0.0.1:4321/
            "${CHROME_BIN}" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=768,1024 --screenshot=screenshots-ci/veko-website-tablet.png \
              http://127.0.0.1:4321/
            "${CHROME_BIN}" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=390,844 --screenshot=screenshots-ci/veko-website-mobile.png \
              http://127.0.0.1:4321/
            "${CHROME_BIN}" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1440,1080 --screenshot=screenshots-ci/veko-website-privacy.png \
              http://127.0.0.1:4321/privacy/
            ls -lh screenshots-ci/
          fi

      - name: Upload static website build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-official-website
          path: website/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload rendered website screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veko-website-screenshots
          path: website/screenshots-ci/
          if-no-files-found: warn
          retention-days: 14

  # Chỉ kích hoạt trên nhánh main khi chủ kho lưu trữ đặt biến VEKO_ENABLE_PAGES_DEPLOY=true hoặc chủ động chạy workflow_dispatch với deploy_pages=true.
  deploy-pages:
    name: Website — Deploy to GitHub Pages (Opt-In Only)
    needs: build-website
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.VEKO_ENABLE_PAGES_DEPLOY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "veko-github-pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install & Build with resolved Pages URL
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://veko.kdns.fr' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: |
          npm ci
          npm run build
          npm run test:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
