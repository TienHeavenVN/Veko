name: Build Chromium 156.0.8078.85 Content SDK (Self-Hosted / Preflight)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy: preflight (kiểm định tag/cấu hình trên GitHub runner) hoặc full-build (biên dịch trên máy chủ self-hosted >=32GB RAM, >=120GB đĩa)"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - full-build
      target_abi:
        description: "Kiến trúc Android cần biên dịch"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      runner_label:
        description: "Nhãn máy chủ chạy job (ubuntu-latest cho preflight, hoặc nhãn self-hosted Linux x86_64 cho full-build)"
        required: true
        default: "ubuntu-latest"
        type: string

permissions:
  contents: read

concurrency:
  group: chromium-sdk-${{ inputs.mode }}-${{ inputs.target_abi }}
  cancel-in-progress: false

jobs:
  chromium-content-sdk:
    name: Chromium 156.0.8078.85 (${{ inputs.mode }} — ${{ inputs.target_abi }})
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout Veko repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Chromium 156.0.8078.85 Preflight & Provenance Check
        env:
          TARGET_ABI: ${{ inputs.target_abi }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/bootstrap-depot-tools.sh \
            ./scripts/build-chromium-android.sh \
            ./scripts/import-chromium-sdk.sh \
            ./scripts/verify-elf-packaging.py
          bash ./scripts/build-chromium-android.sh --preflight-only "--abi=${TARGET_ABI}" | tee preflight-report.txt

      - name: Execute Full Reproducible Chromium Content 156.0.8078.85 Build & SDK Import
        if: ${{ inputs.mode == 'full-build' }}
        env:
          TARGET_ABI: ${{ inputs.target_abi }}
        run: |
          set -euo pipefail
          bash ./scripts/bootstrap-depot-tools.sh
          export PATH="${HOME}/.cache/veko-depot_tools:${PATH}"
          bash ./scripts/build-chromium-android.sh "--abi=${TARGET_ABI}"
          bash ./scripts/import-chromium-sdk.sh "out/chromium-sdk/156.0.8078.85/${TARGET_ABI}"

      - name: Upload Chromium Preflight / SDK Provenance Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-156.0.8078.85-${{ inputs.mode }}-${{ inputs.target_abi }}
          path: |
            preflight-report.txt
            chromium/CHROMIUM_VERSION.lock
            out/chromium-sdk/156.0.8078.85/${{ inputs.target_abi }}/
          if-no-files-found: error
