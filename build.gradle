// Top-level build.gradle — Khai báo plugin chung và kho lưu trữ Mozilla Maven cho toàn project
plugins {
    id 'com.android.application' version '8.13.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.20' apply false
    id 'com.google.dagger.hilt.android' version '2.59.2' apply false
    id 'com.google.devtools.ksp' version '2.3.6' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Giới hạn maven.mozilla.org chỉ phân giải artifact org.mozilla.geckoview để tăng tốc và chống dependency confusion
        maven {
            url "https://maven.mozilla.org/maven2/"
            content {
                includeGroup "org.mozilla.geckoview"
            }
        }
    }
}
