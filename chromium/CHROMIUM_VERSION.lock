# Veko Browser — Pinned Native Engine & Filter Toolchain Lockfile
# Mọi nâng cấp phiên bản Chromium Content bắt buộc kiểm tra ABI, JNI header và chạy đủ regression suite trước khi bump.

CHROMIUM_UPSTREAM_REPO=https://chromium.googlesource.com/chromium/src.git
CHROMIUM_GITHUB_MIRROR=https://github.com/chromium/chromium.git
CHROMIUM_VERSION=156.0.8078.85
CHROMIUM_GIT_TAG=156.0.8078.85
CHROMIUM_COMMIT_SHA=0c5c70590a804c285f0cafe8e9c4c20afcfbc5b5
CHROMIUM_BRANCH_POSITION=refs/branch-heads/8078@{#1853}
CHROMIUM_BRANCHED_FROM_MAIN_SHA=c50edc4214d81e4f944c3415d55104a49e46d214
CHROMIUM_CHANNEL=stable

# Chuỗi công cụ thượng nguồn trích xuất trực tiếp từ DEPS & build/config/android/config.gni tại commit 0c5c70590a80
CHROMIUM_UPSTREAM_NDK_VERSION=2@30.0.16248370
CHROMIUM_UPSTREAM_BUILD_TOOLS=37.0.0
CHROMIUM_UPSTREAM_PLATFORM=android-37.0
CHROMIUM_UPSTREAM_MIN_SDK=29
CHROMIUM_GN_REVISION=510ec7992c30f172205792f190e96111a896ba8f
CHROMIUM_NINJA_VERSION=1.12.1.chromium.4

# Thực tế đóng gói Android của Chromium Content (is_component_build=false không tạo libcontent.so rời):
# Toàn bộ //content + Blink + V8 + Skia + Viz liên kết vào libveko_content_embedder.so kèm Crashpad và gói .pak/ICU/V8.
CHROMIUM_EMBEDDER_SHARED_LIB=libveko_content_embedder.so
CHROMIUM_CRASHPAD_HANDLER_LIB=libchrome_crashpad_handler.so
CHROMIUM_REQUIRED_ASSETS=veko_content.pak,icudtl.dat,v8_context_snapshot_64.bin

ADBLOCK_RUST_CRATE=adblock
ADBLOCK_RUST_VERSION=0.13.4
ADBLOCK_RUST_REPO=https://github.com/brave/adblock-rust
ADBLOCK_RUST_LICENSE=MPL-2.0

ANDROID_MIN_SDK=26
ANDROID_TARGET_SDK=36
ANDROID_COMPILE_SDK=37
ANDROID_ELF_MAX_PAGE_SIZE=16384
PRIMARY_ANDROID_ABI=arm64-v8a
SUPPORTED_ANDROID_ABIS=arm64-v8a,armeabi-v7a,x86_64
